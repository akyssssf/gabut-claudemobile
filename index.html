<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Gambar Gabut — tebak gambar bareng</title>
<style>
:root{--bg:#14121f;--card:#1f1b33;--card2:#2a2547;--ac:#ffcc33;--tx:#f4f1ff;--mu:#9d97bd;--ok:#4be3a0;--bad:#ff6b8b}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  padding:calc(env(safe-area-inset-top) + 10px) 12px calc(env(safe-area-inset-bottom) + 16px)}
#app{max-width:680px;margin:0 auto}
h1{font-size:22px;margin:4px 0 12px;text-align:center}
.card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--mu);font-size:14px}
input[type=text]{width:100%;padding:12px;border-radius:10px;border:2px solid var(--card2);background:#120f20;color:var(--tx);font-size:16px}
input[type=text]:focus{outline:none;border-color:var(--ac)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:12px 16px;background:var(--ac);color:#241a00;font-weight:700}
button:disabled{opacity:.4;cursor:not-allowed}
button.alt{background:var(--card2);color:var(--tx)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1}
.bar{display:flex;justify-content:space-between;align-items:center;font-weight:700;margin-bottom:6px}
#tm{background:var(--card2);padding:4px 12px;border-radius:99px;min-width:64px;text-align:center}
#tm.low{background:var(--bad);color:#fff}
#hint{white-space:pre-wrap;text-align:center;font-size:22px;letter-spacing:4px;font-weight:800;margin:6px 0 10px;min-height:30px;word-break:break-word}
#hint.small{font-size:16px;letter-spacing:0;font-weight:600;color:var(--mu)}
.cvwrap{background:#fff;border-radius:12px;overflow:hidden;aspect-ratio:4/3;width:100%}
canvas{width:100%;height:100%;display:block;touch-action:none}
#tools{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0;align-items:center}
.sw{width:30px;height:30px;border-radius:50%;border:3px solid transparent;padding:0}
.sw.on{border-color:var(--ac);transform:scale(1.15)}
.sz{padding:6px 10px;background:var(--card2);color:var(--tx)}
.sz.on{background:var(--ac);color:#241a00}
#chat{background:var(--card);border-radius:12px;padding:10px;height:130px;overflow-y:auto;margin:10px 0;font-size:15px}
#chat div{padding:2px 0}
#chat .sys{color:var(--mu);font-style:italic}
#chat .ok{color:var(--ok);font-weight:700}
#chat b{color:var(--ac)}
#sb{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border-radius:99px;padding:5px 12px;font-size:14px}
.chip.me{outline:2px solid var(--ac)}
.pick-btn{display:block;width:100%;margin:8px 0;padding:16px;font-size:18px}
#talk h3{margin:0 0 8px;font-size:16px}
.ab{display:flex;gap:8px}
.ab button{flex:1;background:var(--card2);color:var(--tx);text-align:left;font-weight:600;padding:12px;position:relative;overflow:hidden}
.ab button.on{outline:3px solid var(--ac)}
.ab button .cnt{display:block;margin-top:6px;font-size:13px;color:var(--ac)}
.ab button .who{display:block;font-size:12px;font-weight:400;color:var(--mu)}
.callout{margin-top:10px;padding:10px;border-radius:10px;background:#3a2f12;color:var(--ac);font-weight:600}
.q{font-size:18px;font-weight:600;line-height:1.35}
ol.rank{padding-left:22px;margin:8px 0}
ol.rank li{padding:6px 0;font-size:18px}
ul.pl{list-style:none;padding:0;margin:8px 0}
ul.pl li{padding:8px 12px;background:var(--card2);border-radius:10px;margin:6px 0}
</style>
</head>
<body>
<div id="app">
  <h1>🎨 Gambar Gabut</h1>
  <div id="warn" class="card" hidden></div>


  <section id="s-lobby" hidden>
    <div class="card">
      <b>Pemain di ruangan</b>
      <ul class="pl" id="plist"></ul>
      <p class="muted" id="lobby-hint"></p>
      <button id="start" disabled>Menunggu pemain…</button>
      <form id="nf" class="row" style="margin-top:14px"><input id="ni" type="text" maxlength="14" placeholder="Ganti nama (opsional)" autocomplete="off"><button class="alt">Ganti</button></form>
    </div>
  </section>

  <section id="s-game" hidden>
    <div class="bar"><span id="rd"></span><span id="tm">--</span></div>
    <div id="hint"></div>
    <div id="pick" class="card" hidden></div>
    <div class="cvwrap"><canvas id="cv" width="800" height="600"></canvas></div>
    <div id="tools" hidden></div>
    <form id="gf" class="row" hidden style="margin-top:10px"><input id="gi" type="text" maxlength="30" placeholder="Tebak gambarnya…" autocomplete="off"><button>Kirim</button></form>
    <div id="chat"></div>
    <div id="sb"></div>
    <div id="talk" class="card" style="margin-top:12px"></div>
  </section>

  <section id="s-over" class="card" hidden>
    <b style="font-size:20px">🏆 Game selesai!</b>
    <ol class="rank" id="rank"></ol>
    <button id="again">Main lagi</button>
    <p class="muted" id="again-hint"></p>
  </section>
</div>

<script>
(function(){
'use strict';
var WORDS=['sate','bakso','becak','wayang','batik','gunung','pantai','kucing','ayam','ikan','rumah','sepeda','motor','pesawat','kapal','hujan','pelangi','bulan','matahari','bintang','pohon','bunga','kursi','meja','kasur','bantal','laptop','kamera','kacamata','topi','sepatu','payung','jam','kunci','pintu','jendela','tangga','jembatan','sungai','api','es krim','pizza','burger','kopi','durian','pisang','nanas','semangka','monyet','gajah','jerapah','buaya','ular','kupu kupu','laba laba','hiu','penguin','robot','hantu','naga','raja','polisi','dokter','koki','gitar','piano','drum','bola','balon','kado','lilin','kue ulang tahun','nasi goreng','ojek','bajaj','kodok','sapi','kelinci','bebek','tikus','kura kura','cumi cumi','lampu','kulkas','kipas angin','sapu','gunting','sendok','telur','roti','jam dinding','roket','tenda','api unggun'];
var TOPICS=[
{k:'ab',a:'Makan mie instan tiap hari',b:'Nggak boleh main HP seminggu'},
{k:'ab',a:'Bisa terbang tapi cuma setinggi 1 meter',b:'Bisa menghilang tapi cuma pas nggak ada yang lihat'},
{k:'ab',a:'Selalu telat 10 menit',b:'Selalu kecepetan 30 menit'},
{k:'ab',a:'Chat lama kamu dibaca satu grup',b:'Galeri HP kamu dibuka depan teman-teman 1 menit'},
{k:'ab',a:'Liburan ke gunung',b:'Liburan ke pantai'},
{k:'ab',a:'Hidup tanpa musik',b:'Hidup tanpa film'},
{k:'ab',a:'Bisa baca pikiran tapi nggak bisa dimatiin',b:'Bisa lihat masa depan tapi cuma 5 menit'},
{k:'ab',a:'Makan nasi tiap hari seumur hidup',b:'Nggak boleh makan nasi seumur hidup'},
{k:'ab',a:'Jadi orang paling pintar tapi kesepian',b:'Jadi orang biasa tapi temannya banyak'},
{k:'ab',a:'Nginep di rumah hantu semalam',b:'Naik wahana paling ekstrem 3 kali berturut-turut'},
{k:'ab',a:'Sambal pedas banget tiap makan',b:'Semua makanan hambar tanpa bumbu'},
{k:'ab',a:'Semua orang tahu isi DM kamu',b:'Semua orang tahu isi dompet kamu'},
{k:'ab',a:'Kuota unlimited tapi sinyal lemot',b:'Kuota 1GB tapi sinyal ngebut'},
{k:'ab',a:'Jadi kucing sehari',b:'Jadi burung sehari'},
{k:'ab',a:'Tim bangun pagi',b:'Tim begadang'},
{k:'ab',a:'Bisa ngomong sama hewan',b:'Bisa ngerti semua bahasa manusia'},
{k:'ab',a:'Mantan tiba-tiba nyapa',b:'Gebetan nge-read doang'},
{k:'ab',a:'Mandi air dingin tiap hari',b:'Nggak AC dan nggak kipas seumur hidup'},
{k:'why',q:'Hal paling random yang pernah bikin kamu ketawa sampai nggak bisa berhenti?'},
{k:'why',q:'Kenapa kamu bisa berteman sama orang-orang di ruangan ini? Awal ketemunya gimana?'},
{k:'why',q:'Kejadian paling memalukan yang masih kamu inget? Ceritain kenapa bisa kejadian!'},
{k:'why',q:'Kalau bisa pindah ke kota/negara mana pun besok, kamu pilih mana dan kenapa?'},
{k:'why',q:'Makanan apa yang menurutmu overrated, dan kenapa?'},
{k:'why',q:'Skill apa yang pengen kamu kuasai instan, dan buat apa?'},
{k:'why',q:'Kebiasaan aneh kamu yang nggak banyak orang tahu? Kenapa bisa gitu?'},
{k:'why',q:'Lagu apa yang kalau diputer langsung bikin kamu keinget sesuatu? Ingat apa?'},
{k:'why',q:'Kalau besok libur dadakan seminggu, kamu mau ngapain dan kenapa?'},
{k:'why',q:'Pernah nggak nyasar atau salah naik kendaraan? Ceritain dong kenapa bisa!'},
{k:'why',q:'Film atau series yang nggak bakal bosan kamu tonton ulang, kenapa?'},
{k:'why',q:'Siapa orang di sini yang menurutmu paling gampang panik? Kenapa?'},
{k:'why',q:'Barang apa yang paling susah kamu buang walau udah nggak kepake? Kenapa?'},
{k:'why',q:'Mimpi teraneh yang pernah kamu inget, ceritain!'}
];
var COLORS=['#111111','#e53935','#fb8c00','#fdd835','#43a047','#1e88e5','#8e24aa','#8d6e63','#ffffff'];
var SIZES=[4,9,18];
var DRAW_SECS=40, PICK_SECS=8, END_SECS=10, AGAIN_SECS=15;

function $(id){return document.getElementById(id)}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function show(id,v){var e=$(id);if(e)e.hidden=!v}
function norm(s){return String(s).toLowerCase().replace(/[^a-z0-9 ]/g,'').replace(/\s+/g,' ').trim()}
function hash(s){var h1=0xdeadbeef,h2=0x41c6ce57;for(var i=0;i<s.length;i++){var c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
function clamp(n,a,b){n=+n;if(!isFinite(n))return a;return Math.max(a,Math.min(b,n))}

var R=null, myName='', joinT=Date.now(), score=0, peers=[];
var lastG=null, phaseAt=0, seen={n:-1,phase:'',at:0};
var myWord=null, pickFor=-1, choices=[], drawerScored=-1, myGuessOk=-1;
var chatItems=[];
var cv=$('cv'), ctx=cv.getContext('2d');
var cur={ci:0,si:1}, drawing=false, buf=[], first=true, prevLast=null, flushT=null;

var savedName='';try{savedName=localStorage.getItem('gg-name')||''}catch(e){}

/* ---------- room helpers ---------- */
function players(){return peers.filter(function(p){return p.kind==='viewer'&&p.presence&&typeof p.presence.name==='string'&&p.presence.name})}
function byPeer(id){return players().filter(function(p){return p.peer===id})[0]}
function nameOf(id){var p=byPeer(id);return p?p.presence.name:'?'}
function me(){return peers.filter(function(p){return p.sameTab})[0]}
function host(){return players().slice().sort(function(a,b){return ((a.presence.t||0)-(b.presence.t||0))||(a.peer<b.peer?-1:1)})[0]}
function amHost(){var h=host(),m=me();return !!(h&&m&&h.peer===m.peer)}
function curG(){var h=host();return (h&&h.presence.game)||null}
function pres(p){R&&R.presence(p).catch(function(){})}
function emit(t,d){R&&R.emit(t,d).catch(function(){})}
function pubG(o){o.v=((lastG&&lastG.v)||0)+1;lastG=o;phaseAt=Date.now();pres({game:o})}
function addChat(cls,html){chatItems.push({c:cls,h:html});if(chatItems.length>40)chatItems.shift();renderChat()}
function renderChat(){var c=$('chat');c.innerHTML=chatItems.map(function(i){return '<div class="'+i.c+'">'+i.h+'</div>'}).join('');c.scrollTop=c.scrollHeight}

/* ---------- host logic ---------- */
function byT(a,b){return ((a.presence.t||0)-(b.presence.t||0))||(a.peer<b.peer?-1:1)}
function startGame(){
  var ps=players().slice().sort(byT); if(ps.length<2)return;
  pubG({phase:'pick',n:1,total:ps.length,order:ps.map(function(p){return p.peer}),drawer:ps[0].peer,dur:DRAW_SECS,tq:pickTopic()});
}
var usedT={};
function pickTopic(){var ids=[];TOPICS.forEach(function(t,i){if(!usedT[i])ids.push(i)});if(!ids.length){usedT={};TOPICS.forEach(function(t,i){ids.push(i)})}
  var i=ids[Math.floor(Math.random()*ids.length)];usedT[i]=1;return i}
function nextRound(g){
  if(g.n>=g.total)return pubG({phase:'over',n:g.n,total:g.total,order:g.order,drawer:g.drawer});
  var n=g.n+1;
  pubG({phase:'pick',n:n,total:g.total,order:g.order,drawer:g.order[(n-1)%g.order.length],dur:DRAW_SECS,tq:pickTopic()});
}
function tick(){
  if(!R||!myName||!amHost())return;
  var g=curG(), ps=players();
  if(!g){ if(lastG&&lastG.phase!=='lobby'){pubG(Object.assign({},lastG));return} g={phase:'lobby'} }
  var el=Date.now()-phaseAt;
  if(g.phase==='lobby'){
    /* menunggu seseorang menekan Mulai */
  }else if(g.phase==='pick'){
    if(!byPeer(g.drawer)||el>(PICK_SECS+3)*1000) nextRound(g);
  }else if(g.phase==='draw'){
    var guessers=ps.filter(function(p){return p.peer!==g.drawer});
    var allIn=guessers.length>0&&guessers.every(function(p){return p.presence.sv===g.n});
    if(el>g.dur*1000||!byPeer(g.drawer)||allIn) pubG(Object.assign({},g,{phase:'end'}));
  }else if(g.phase==='end'){
    if(el>END_SECS*1000) nextRound(g);
  }else if(g.phase==='over'){
    if(el>AGAIN_SECS*1000) pubG({phase:'lobby'});
  }
}

/* ---------- drawing ---------- */
function paint(p,ci,si){
  var W=cv.width,H=cv.height,col=COLORS[ci]||COLORS[0],lw=(SIZES[si]||SIZES[1])*(W/800)*1.4;
  ctx.strokeStyle=col;ctx.fillStyle=col;ctx.lineWidth=lw;ctx.lineCap='round';ctx.lineJoin='round';
  if(p.length<4){ctx.beginPath();ctx.arc(p[0]*W/1000,p[1]*H/1000,lw/2,0,Math.PI*2);ctx.fill();return}
  ctx.beginPath();ctx.moveTo(p[0]*W/1000,p[1]*H/1000);
  for(var i=2;i<p.length;i+=2)ctx.lineTo(p[i]*W/1000,p[i+1]*H/1000);
  ctx.stroke();
}
function clearCv(){ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height)}
clearCv();
function canDraw(){var g=curG(),m=me();return !!(g&&m&&g.phase==='draw'&&g.drawer===m.peer&&myWord)}
function pos(e){var r=cv.getBoundingClientRect();return [Math.round(clamp((e.clientX-r.left)/r.width*1000,0,1000)),Math.round(clamp((e.clientY-r.top)/r.height*1000,0,1000))]}
function flush(){
  if(!buf.length)return;var g=curG();if(!g)return;
  var p=prevLast?prevLast.concat(buf):buf.slice();
  emit('d',{n:g.n,ci:cur.ci,si:cur.si,b:first?1:0,p:p});
  first=false;prevLast=buf.slice(-2);buf=[];
}
cv.addEventListener('pointerdown',function(e){
  if(!canDraw())return;e.preventDefault();
  try{cv.setPointerCapture(e.pointerId)}catch(x){}
  drawing=true;first=true;prevLast=null;var pt=pos(e);buf=[pt[0],pt[1]];
  paint(buf,cur.ci,cur.si);flush();
  clearInterval(flushT);flushT=setInterval(flush,90);
});
cv.addEventListener('pointermove',function(e){
  if(!drawing)return;e.preventDefault();var pt=pos(e);
  var lx=buf.length?buf[buf.length-2]:prevLast[0],ly=buf.length?buf[buf.length-1]:prevLast[1];
  paint([lx,ly,pt[0],pt[1]],cur.ci,cur.si);buf.push(pt[0],pt[1]);
  if(buf.length>300)flush();
});
function endStroke(){if(!drawing)return;drawing=false;flush();clearInterval(flushT);prevLast=null}
cv.addEventListener('pointerup',endStroke);
cv.addEventListener('pointercancel',endStroke);

function buildTools(){
  var t=$('tools'),h='';
  COLORS.forEach(function(c,i){h+='<button type="button" class="sw'+(i===cur.ci?' on':'')+'" data-ci="'+i+'" style="background:'+c+';'+(i===8?'border-color:#555':'')+'" aria-label="warna '+i+'">'+(i===8?'':'')+'</button>'});
  SIZES.forEach(function(s,i){h+='<button type="button" class="sz'+(i===cur.si?' on':'')+'" data-si="'+i+'">'+['•','●','⬤'][i]+'</button>'});
  h+='<button type="button" class="alt" id="clr">Hapus</button>';
  t.innerHTML=h;
}
buildTools();
document.addEventListener('click',function(e){
  var b=e.target.closest&&e.target.closest('button');if(!b)return;
  if(b.dataset.ci!==undefined){cur.ci=+b.dataset.ci;buildTools()}
  else if(b.dataset.si!==undefined){cur.si=+b.dataset.si;buildTools()}
  else if(b.id==='clr'){if(canDraw()){clearCv();var g=curG();emit('c',{n:g.n})}}
  else if(b.dataset.w!==undefined){chooseWord(b.dataset.w)}
  else if(b.dataset.ab){var gg=curG();if(gg)pres({ab:{n:gg.n,c:b.dataset.ab}})}
});

/* ---------- messages ---------- */
function connect(R_){
  R=R_;
  R.on('d',function(m){
    var g=curG(),d=m.data;if(m.isMe||!g||g.phase!=='draw'||m.peer!==g.drawer||!d||d.n!==g.n||!Array.isArray(d.p))return;
    var p=d.p.slice(0,400).map(function(v){return clamp(v,0,1000)});if(p.length%2)p.pop();if(p.length<2)return;
    paint(p,clamp(d.ci,0,8)|0,clamp(d.si,0,2)|0);
  });
  R.on('c',function(m){var g=curG();if(m.isMe||!g||m.peer!==g.drawer||!m.data||m.data.n!==g.n)return;clearCv()});
  R.on('start',function(m){
    if(!amHost())return;var g=curG();
    if(!g||g.phase==='lobby'||g.phase==='over')startGame();
  });
  R.on('w',function(m){
    var d=m.data;if(!amHost()||!d)return;var g=curG();
    if(g&&g.phase==='pick'&&m.peer===g.drawer&&d.n===g.n&&typeof d.h==='string'&&typeof d.hint==='string'){
      pubG(Object.assign({},g,{phase:'draw',hint:d.hint.slice(0,60),h:d.h.slice(0,24)}));
    }
  });
  R.on('g',function(m){
    var g=curG(),d=m.data;if(!d||typeof d.t!=='string'||!g||d.n!==g.n)return;
    var p=byPeer(m.peer);addChat('', '<b>'+esc(p?p.presence.name:'?')+':</b> '+esc(d.t.slice(0,40)));
  });
  R.on('ok',function(m){
    var g=curG(),d=m.data;if(!d||!g||d.n!==g.n)return;
    addChat('ok','🎉 '+esc(nameOf(m.peer))+' menebak dengan benar!');
  });
  R.onPeers(function(ch){peers=ch.peers;update()});
  peers=R.peers();
  var done=function(n){myName=(savedName||n||('Pemain'+(100+Math.floor(Math.random()*900)))).slice(0,14);pres({name:myName,t:joinT,s:0});update()};
  if(window.claude&&window.claude.use)window.claude.use('user').then(function(us){return us?us.me():null}).then(function(v){done(v&&v.name)}).catch(function(){done('')});
  else done('');
}

function chooseWord(w){
  var g=curG();if(!g||g.phase!=='pick')return;
  myWord=w;clearCv();
  emit('w',{n:g.n,hint:w.replace(/[^ ]/g,'_').split('').join(' '),h:hash(norm(w)+':'+g.n)});
}

$('nf').addEventListener('submit',function(e){
  e.preventDefault();var v=$('ni').value.trim().slice(0,14);if(!v)return;
  myName=v;try{localStorage.setItem('gg-name',v)}catch(x){}
  pres({name:v});$('ni').value='';update();
});
function requestStart(){if(players().length<2)return;if(amHost())startGame();else emit('start',{})}
$('start').addEventListener('click',requestStart);
$('again').addEventListener('click',requestStart);
$('gf').addEventListener('submit',function(e){
  e.preventDefault();var g=curG(),t=$('gi').value.trim();$('gi').value='';
  if(!g||g.phase!=='draw'||!t)return;
  if(hash(norm(t)+':'+g.n)===g.h){
    var dur=g.dur||DRAW_SECS,rem=Math.max(0,dur-(Date.now()-seen.at)/1000);
    var pts=100+Math.round(400*rem/dur);score+=pts;myGuessOk=g.n;
    pres({s:score,sv:g.n});emit('ok',{n:g.n});
    addChat('ok','✅ Benar! +'+pts+' poin');
  }else{emit('g',{n:g.n,t:t})}
});

/* ---------- render ---------- */
function update(){
  var ps=players(),m=me(),g=curG();
  if(g&&(!lastG||g.v>=lastG.v))lastG=g;
  if(g&&(g.n!==seen.n||g.phase!==seen.phase)){
    seen={n:g.n,phase:g.phase,at:Date.now()};
    if(g.phase==='pick'&&g.n===1){score=0;myGuessOk=-1;drawerScored=-1;pres({s:0,sv:0})}
    if(g.phase==='pick'){clearCv();myWord=null;buf=[];drawing=false;chatItems=[];addChat('sys','Ronde '+g.n+'/'+g.total+' — '+esc(nameOf(g.drawer))+' yang gambar')}
    if(g.phase==='lobby'){score=0;myGuessOk=-1;drawerScored=-1;pres({s:0,sv:0})}
  }
  var inLobby=!g||g.phase==='lobby', inGame=!!g&&(g.phase==='pick'||g.phase==='draw'||g.phase==='end'), over=!!g&&g.phase==='over';
  show('s-lobby',!!myName&&inLobby);show('s-game',!!myName&&inGame);show('s-over',!!myName&&over);
  if(!myName)return;
  var iAmHost=amHost();

  if(inLobby){
    $('plist').innerHTML=ps.slice().sort(byT).map(function(p,i){return '<li>'+(i===0?'👑 ':'')+esc(p.presence.name)+(p.peer===(m&&m.peer)?' (kamu)':'')+'</li>'}).join('');
    $('start').disabled=ps.length<2;
    $('start').textContent=ps.length<2?'Menunggu pemain… ('+ps.length+'/2)':'▶ Mulai game ('+ps.length+' pemain)';
    $('lobby-hint').textContent=ps.length<2?'Kamu sudah masuk! Butuh minimal 2 pemain. Ajak temanmu buka link yang sama.':'Kalau semua sudah masuk, siapa pun boleh pencet Mulai. Tiap orang dapat giliran gambar sekali.';
  }

  if(inGame){
    var isDrawer=!!m&&g.drawer===m.peer, solved=ps.filter(function(p){return p.peer!==g.drawer&&p.presence.sv===g.n});
    $('rd').textContent='Ronde '+g.n+'/'+g.total+' · ✏️ '+nameOf(g.drawer);
    var tm=$('tm'),hint=$('hint');tm.classList.remove('low');hint.classList.remove('small');
    var dp=byPeer(g.drawer),dw=dp&&dp.presence.w;
    if(g.phase==='pick'){
      var left=Math.max(0,PICK_SECS-Math.floor((Date.now()-seen.at)/1000));tm.textContent=left+'s';
      hint.classList.add('small');hint.textContent=isDrawer?'Pilih kata yang mau kamu gambar:':nameOf(g.drawer)+' lagi milih kata…';
      show('pick',isDrawer);
      if(isDrawer&&pickFor!==g.n){pickFor=g.n;choices=[];while(choices.length<3){var w=WORDS[Math.floor(Math.random()*WORDS.length)];if(choices.indexOf(w)<0)choices.push(w)}
        $('pick').innerHTML=choices.map(function(w){return '<button class="pick-btn alt" data-w="'+esc(w)+'">'+esc(w)+'</button>'}).join('')}
    }else{
      show('pick',false);
      if(g.phase==='draw'){
        var rem=Math.max(0,Math.ceil((g.dur||DRAW_SECS)-(Date.now()-seen.at)/1000));tm.textContent=rem+'s';if(rem<=10)tm.classList.add('low');
        if(isDrawer&&myWord)hint.textContent='Gambar: '+myWord.toUpperCase();
        else if(isDrawer){hint.classList.add('small');hint.textContent='Memuat…'}
        else hint.textContent=g.hint||'';
      }else{
        tm.textContent='⏱';
        hint.textContent='Jawabannya: '+((dw&&dw.n===g.n&&dw.t)||(isDrawer&&myWord)||'…').toUpperCase();
        if(isDrawer&&myWord){
          if(drawerScored!==g.n){drawerScored=g.n;score+=40*solved.length;pres({s:score,w:{n:g.n,t:myWord}})}
        }
      }
    }
    show('tools',g.phase==='draw'&&isDrawer&&!!myWord);
    show('gf',g.phase==='draw'&&!isDrawer&&myGuessOk!==g.n);
    $('sb').innerHTML=ps.slice().sort(function(a,b){return (b.presence.s||0)-(a.presence.s||0)}).map(function(p){
      var mark=p.peer===g.drawer?'✏️ ':(p.presence.sv===g.n?'✅ ':'');
      return '<span class="chip'+(m&&p.peer===m.peer?' me':'')+'">'+mark+esc(p.presence.name)+' · '+(p.presence.s||0)+'</span>'}).join('');
  }

  if(inGame){
    if(g.phase==='pick'&&m&&g.drawer===m.peer&&!myWord&&choices.length&&Date.now()-seen.at>PICK_SECS*1000)chooseWord(choices[0]);
    renderTalk(g,ps,m);
  }

  if(over){
    $('rank').innerHTML=ps.slice().sort(function(a,b){return (b.presence.s||0)-(a.presence.s||0)}).map(function(p,i){
      return '<li>'+(['🥇 ','🥈 ','🥉 '][i]||'')+esc(p.presence.name)+' — <b>'+(p.presence.s||0)+'</b></li>'}).join('');
    $('again').hidden=false;$('again-hint').textContent='Atau tunggu sebentar, nanti balik ke lobby otomatis.';
  }
}
var lastTalk='';
function renderTalk(g,ps,m){
  var tp=TOPICS[g.tq],h='',ended=g.phase==='end';
  if(!tp){$('talk').hidden=true;return}
  $('talk').hidden=false;
  if(tp.k==='ab'){
    var votes=ps.map(function(p){var v=p.presence.ab;return {p:p,c:(v&&v.n===g.n&&(v.c==='a'||v.c==='b'))?v.c:null}});
    var mine=(m&&m.presence.ab&&m.presence.ab.n===g.n)?m.presence.ab.c:null;
    var reveal=ended||!!mine;
    var A=votes.filter(function(x){return x.c==='a'}),B=votes.filter(function(x){return x.c==='b'});
    function side(k,txt,arr){return '<button data-ab="'+k+'" class="'+(mine===k?'on':'')+'"><b>'+k.toUpperCase()+'.</b> '+esc(txt)+
      (reveal?'<span class="cnt">'+arr.length+' orang</span>':'')+
      (ended&&arr.length?'<span class="who">'+arr.map(function(x){return esc(x.p.presence.name)}).join(', ')+'</span>':'')+'</button>'}
    h='<h3>🤔 Pilih satu! (ngobrolin sambil nunggu)</h3><div class="ab">'+side('a',tp.a,A)+side('b',tp.b,B)+'</div>';
    if(ended){
      var tot=A.length+B.length,msg='';
      if(tot>=3&&(A.length===1||B.length===1)&&A.length!==B.length){var lone=A.length===1?A[0]:B[0];msg='👀 '+esc(lone.p.presence.name)+' sendirian di sini. Jelasin kenapa!'}
      else if(tot>=2&&(A.length===0||B.length===0))msg='🤝 Kompak banget! Tapi kenapa pada milih itu?';
      else if(tot>=2&&A.length===B.length)msg='⚔️ Imbang! Silakan debat, masing-masing kasih alasan.';
      else if(tot<2)msg='Belum banyak yang milih. Pilih dong, terus ceritain alasannya!';
      else msg='💬 Yang minoritas, bela pilihanmu!';
      h+='<div class="callout">'+msg+'</div>';
    }
  }else{
    h='<h3>🗣️ Kenapa? Bahan cerita</h3><div class="q">'+esc(tp.q)+'</div>';
    if(ended){var order=ps.slice().sort(byT);if(order.length){var who=order[g.n%order.length];h+='<div class="callout">🎤 '+esc(who.presence.name)+', giliran kamu cerita! Yang lain boleh nyaut.</div>'}}
    else h+='<div class="muted" style="margin-top:8px">Siapa yang jawab? Nanti ketahuan pas ronde selesai 😏</div>';
  }
  if(h!==lastTalk){lastTalk=h;$('talk').innerHTML=h}
}
setInterval(function(){tick();if(myName)update()},400);

/* ---------- MQTT room (dipakai kalau tidak dibuka lewat claude.ai, mis. GitHub Pages) ---------- */
var BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
function mqttRoom(roomId,brokers){
  return new Promise(function(resolve,reject){
    var id=Math.random().toString(36).slice(2,10), base='gambargabut/v1/'+roomId;
    var pres={}, remote={}, hs={}, pcbs=[], snap=[], client=null, isUp=false, pubT=null, rbT=null, resolved=false;
    function rebuild(){
      var arr=[{peer:id,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,presence:pres,updatedAt:Date.now()}];
      Object.keys(remote).sort().forEach(function(k){arr.push({peer:k,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,presence:remote[k].p,updatedAt:remote[k].seen})});
      snap=arr;
      if(!rbT)rbT=setTimeout(function(){rbT=null;pcbs.forEach(function(f){f({peers:snap,joined:[],left:[],updated:[]})})},0);
    }
    function pubPres(){pubT=null;if(client&&isUp)client.publish(base+'/pr',JSON.stringify({f:id,p:pres}))}
    function schedPub(){if(!pubT)pubT=setTimeout(pubPres,80)}
    function deliver(topic,msg){(hs[topic]||[]).forEach(function(f){try{f(msg)}catch(e){}})}
    var room={
      presence:function(patch){Object.keys(patch).forEach(function(k){if(patch[k]===null)delete pres[k];else pres[k]=patch[k]});pres=Object.assign({},pres);rebuild();schedPub();return Promise.resolve()},
      emit:function(topic,data){
        if(client&&isUp)client.publish(base+'/ev',JSON.stringify({f:id,t:topic,d:data}));
        deliver(topic,{peer:id,by:null,isMe:true,sameTab:true,kind:'viewer',guest:false,topic:topic,data:data});
        return Promise.resolve()},
      on:function(topic,fn){(hs[topic]=hs[topic]||[]).push(fn);return function(){}},
      peers:function(){return snap},
      onPeers:function(fn){pcbs.push(fn);return function(){}},
      connected:function(){return isUp},
      join:function(){return Promise.resolve(room)}
    };
    function onMsg(topic,payload){
      var d;try{d=JSON.parse(payload.toString())}catch(e){return}
      if(!d||typeof d.f!=='string'||d.f===id)return;
      if(topic===base+'/pr'){
        if(d.bye){delete remote[d.f];rebuild();return}
        var isNew=!remote[d.f];remote[d.f]={p:(d.p&&typeof d.p==='object')?d.p:{},seen:Date.now()};
        if(isNew)schedPub();
        rebuild();
      }else if(topic===base+'/ev'&&typeof d.t==='string'){
        deliver(d.t,{peer:d.f,by:null,isMe:false,sameTab:false,kind:'viewer',guest:false,topic:d.t,data:d.d});
      }
    }
    function tryBroker(i){
      if(i>=brokers.length){if(!resolved)reject(new Error('no broker'));return}
      var done=false, c=mqtt.connect(brokers[i],{clientId:'gg-'+id,clean:true,connectTimeout:6000,reconnectPeriod:2500,
        will:{topic:base+'/pr',payload:JSON.stringify({f:id,bye:1}),qos:0}});
      var to=setTimeout(function(){if(!done){done=true;c.end(true);tryBroker(i+1)}},8000);
      c.on('connect',function(){
        isUp=true;client=c;
        c.subscribe([base+'/pr',base+'/ev'],function(){pubPres()});
        if(!done){done=true;clearTimeout(to);
          if(!resolved){resolved=true;resolve(room)}}
      });
      c.on('close',function(){isUp=false});
      c.on('error',function(){if(!done){done=true;clearTimeout(to);c.end(true);tryBroker(i+1)}});
      c.on('message',onMsg);
    }
    setInterval(function(){
      var now=Date.now(),ch=false;Object.keys(remote).forEach(function(k){if(now-remote[k].seen>11000){delete remote[k];ch=true}});
      if(ch)rebuild();
    },2000);
    setInterval(function(){if(client&&isUp)pubPres()},4000);
    window.addEventListener('pagehide',function(){try{if(client&&isUp)client.publish(base+'/pr',JSON.stringify({f:id,bye:1}));if(client)client.end(true)}catch(e){}});
    rebuild();
    tryBroker(0);
  });
}
function startMqtt(){
  var w=$('warn');
  var rid=(location.hash.replace('#','').toLowerCase().replace(/[^a-z0-9-]/g,'').slice(0,24))||'umum';
  function fail(){w.hidden=false;w.textContent='Gagal tersambung ke server realtime. Cek koneksi internet lalu muat ulang.'}
  var sc=document.createElement('script');sc.src='mqtt.min.js';
  sc.onload=function(){mqttRoom(rid,window.GG_BROKERS||BROKERS).then(connect).catch(fail)};
  sc.onerror=fail;
  document.head.appendChild(sc);
}

/* ---------- boot ---------- */
function boot(){
  var w=$('warn');
  if(!window.claude||!window.claude.use){startMqtt();return}
  window.claude.use('room').then(function(base){
    if(!base){w.hidden=false;w.textContent='Room belum tersambung. Pastikan kamu login dan sudah diundang ke halaman ini, lalu muat ulang.';return}
    return base.join('gambar-gabut').catch(function(){return base}).then(connect);
  }).catch(function(){w.hidden=false;w.textContent='Gagal menyambung ke room.'});
}
boot();
})();
